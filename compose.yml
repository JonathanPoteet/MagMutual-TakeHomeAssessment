services:
  backend:
    build:
      context: ./assessment-backend
    container_name: magmutual-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_JSON: '{"spring.datasource.url":"jdbc:sqlite:/data/users.db"}'
    volumes:
      - ./assessment-backend/data:/data:z

  frontend:
    build:
      context: ./assessment-frontend
    container_name: magmutual-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: "http://localhost:8080"

